# Configurazione di pytest.
[pytest]
# Dove stanno i test.
testpaths = tests

# Aggiunge la radice del progetto ai percorsi di ricerca dei moduli, cosi'
# "from app.main import app" funziona anche lanciando pytest senza installare
# il progetto come pacchetto.
pythonpath = .

# Mostra il motivo dei test saltati nel riepilogo finale.
addopts = -ra

# Starlette avvisa che in futuro il suo client di test usera' httpx2.
# Finche' non cambiamo libreria l'avviso e' solo rumore.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
